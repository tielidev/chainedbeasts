          - paragraph [ref=f3e60]: "Healing in Chained Beasts comes with a trade-off: the developer describes accepting afflictions when recovering between rounds. These drawbacks can affect movement, perception or decisions. Judge recovery by your ability to handle the next fight, not just by the health you gain immediately."
