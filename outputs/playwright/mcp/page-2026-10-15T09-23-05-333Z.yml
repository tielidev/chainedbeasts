      - generic [ref=f3e65]:
        - paragraph [ref=f3e66]: "Healing in Chained Beasts comes with a trade-off: the developer describes accepting afflictions when recovering between rounds. These drawbacks can affect movement, perception or decisions. Judge recovery by your ability to handle the next fight, not just by the health you gain immediately."
        - heading "Why does healing have side effects?" [level=2] [ref=f3e67]
        - paragraph [ref=f3e68]: The official description presents wounds and potion side effects as part of the run’s challenge. The October 10 announcement says the launch game contains more than seventy afflictions. A large total does not mean every effect is a simple numerical penalty.
        - paragraph [ref=f3e69]: For example, that announcement describes Annoying as prompting nearby allies to attack, Impulsive as forcing certain skill and shopping decisions, and Infatuated as changing camera focus around an ally. Those examples show why you should read the effect instead of deciding from the name alone.
        - heading "How should a team evaluate an affliction?" [level=2] [ref=f3e70]
        - paragraph [ref=f3e71]: Our recommendation is to explain the drawback aloud before committing. Ask whether it changes how closely you can move together, what you can see or what you can choose between battles. Someone else’s normal positioning may become risky after your condition changes.
        - paragraph [ref=f3e72]:
          - text: Revisit your
          - link "chain plan" [ref=f3e73] [cursor=pointer]:
            - /url: /co-op/chain-teamwork/
          - text: after a major drawback. In
          - link "solo play" [ref=f3e74] [cursor=pointer]:
            - /url: /guides/solo-guide/
          - text: ", evaluate the same effect without assuming a teammate can compensate."
        - heading "What does the Surgeon do?" [level=2] [ref=f3e75]
        - paragraph [ref=f3e76]: The July beta update introduced a Surgeon between acts who can help manage afflictions or offer body augmentations that grant skills. The developer noted that procedures have costs. We do not infer exact prices, guaranteed cures or unrestricted access from that announcement.
        - paragraph [ref=f3e77]: Read the actual offer in the current game before spending resources. Surgery is part of a wider recovery decision, not evidence that all earlier choices can be undone without consequence.
        - heading "What information should you trust?" [level=2] [ref=f3e78]
        - paragraph [ref=f3e79]:
          - text: Use current in-game descriptions for specific effects. Treat this page as a sourced explanation of the system and our suggested decision process. For related choices, see
          - link "skills and shopping" [ref=f3e80] [cursor=pointer]:
            - /url: /combat/skills-and-shopping/
          - text: ; we avoid publishing a complete affliction database until each entry can be checked.
